[package]
name = "pet-record-registry"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "21.7.0"

[dev-dependencies]
soroban-sdk = { version = "21.7.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true
debug = false
strip = "symbols"

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
